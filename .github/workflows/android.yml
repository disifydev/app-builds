name: android
on:
  workflow_dispatch:
    inputs:
      ref: { description: "branch/sha of source repo", default: "main", required: true }
permissions: {}
concurrency: { group: android-${{ inputs.ref }}, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch source (read-only key)
        env: { KEY: "${{ secrets.SRC_DEPLOY_KEY }}", REPO: "${{ secrets.SRC_REPO }}", REF: "${{ inputs.ref }}" }
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/src && chmod 600 ~/.ssh/src
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/src" git clone -q --depth 1 --branch "$REF" "git@github.com:$REPO.git" src 2>/dev/null || { GIT_SSH_COMMAND="ssh -i ~/.ssh/src" git clone -q "git@github.com:$REPO.git" src && git -C src checkout -q "$REF"; }
          rm -f ~/.ssh/src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Build and test
        working-directory: src/android
        env: { GS: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          [ -n "$GS" ] && printf '%s' "$GS" > app/google-services.json
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon -q test assembleDebug 2>&1 | tail -200
      - name: Encrypt APK
        if: always()
        env: { PASS: "${{ secrets.ARTIFACT_PASS }}" }
        run: |
          apk=$(find src/android -name "*.apk" -path "*outputs*" | head -1); [ -n "$apk" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$apk" -out app.apk.enc -pass env:PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-apk, path: app.apk.enc, retention-days: 1, if-no-files-found: ignore }
      - name: Clean
        if: always()
        run: rm -rf src
